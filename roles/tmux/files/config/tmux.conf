set-option -g prefix C-a
bind-key C-a last-window
## Allows us to use C-a a <command> to send commands to a TMUX session inside
## another TMUX session
bind-key a send-prefix

set-window-option -g mode-keys vi
set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set-option -sa terminal-features ',tmux-256color:RGB'
set-option -g focus-events on
set -s set-clipboard on
##no delay
set -s escape-time 0
##start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 100000
set -g mouse on
set -g display-panes-time 3000
set -g repeat-time 2000
set -g status-interval 5
# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*. Much more reasonable.
setw -g aggressive-resize on

bind-key Space  next-layout
bind-key c      new-window -c "#{pane_current_path}"
bind-key |      split-window -h -c "#{pane_current_path}"
bind-key \      split-window -h -c "#{pane_current_path}"
bind-key -      split-window -v -c "#{pane_current_path}"
bind-key p      display-popup -w 80% -h 80% -E "zsh"
bind-key n      command-prompt 'rename-window %%'
bind-key N      command-prompt 'rename-session %%'
bind-key Escape copy-mode -u
# Moving between panes.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Synchronize panes
bind C-p setw synchronize-panes
# Resizing panes
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r H resize-pane -L 5
bind-key -r L resize-pane -R 5
bind-key -r ) switch-client -n
bind-key -r ( switch-client -p
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi Enter send -X copy-selection-and-cancel

## TokyoNight Storm palette
set -g @tokyonight_bg '#24283b'
set -g @tokyonight_bg_dark '#1f2335'
set -g @tokyonight_bg_highlight '#292e42'
set -g @tokyonight_bg_panel '#3b4261'
set -g @tokyonight_bg_muted '#414868'
set -g @tokyonight_fg '#c0caf5'
set -g @tokyonight_fg_muted '#a9b1d6'
set -g @tokyonight_comment '#565f89'
set -g @tokyonight_blue '#7aa2f7'
set -g @tokyonight_cyan '#7dcfff'
set -g @tokyonight_yellow '#e0af68'
set -g @tokyonight_red '#f7768e'

## set window notifications
set-option -g visual-activity on
set-window-option -g monitor-activity on
## highlight active window (TokyoNight Storm palette with higher legibility)
set-window-option -gF window-status-current-style "bg=#{@tokyonight_bg_panel},fg=#{@tokyonight_fg},bold"
set-window-option -g automatic-rename off
# pane border and colors
set-option -gF pane-active-border-style "fg=#{@tokyonight_blue}"
set-option -gF pane-border-style "fg=#{@tokyonight_bg_muted}"
set-option -gF display-panes-active-colour "#{@tokyonight_blue}"
set-option -gF display-panes-colour "#{@tokyonight_comment}"
set-option -gF message-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_bg_panel}"
set-option -gF message-command-style "fg=#{@tokyonight_bg_dark},bg=#{@tokyonight_yellow},bold"
set-window-option -gF mode-style "fg=#{@tokyonight_blue},bg=#{@tokyonight_bg_highlight},bold"
set-option -gF popup-border-style "fg=#{@tokyonight_bg_muted},bg=#{@tokyonight_bg}"
set-option -gF popup-style "fg=#{@tokyonight_fg},bg=#{@tokyonight_bg_dark}"
set-window-option -gF clock-mode-colour "#{@tokyonight_blue}"
## set status bar
set-option -gF status-bg "#{@tokyonight_bg}"
set-option -gF status-fg "#{@tokyonight_fg_muted}"
set-window-option -gF window-status-style "bg=#{@tokyonight_bg},fg=#{@tokyonight_comment}"
set-window-option -gF window-status-activity-style "bg=#{@tokyonight_bg_muted},fg=#{@tokyonight_yellow},bold"
set-option -g status-right-length 90
set-option -g status-left-length 60
set-window-option -g clock-mode-style 24
set-option -g status-left '#[fg=#{@tokyonight_bg_dark},bg=#{@tokyonight_blue},bold] #S #[fg=#{@tokyonight_fg},bg=#{@tokyonight_bg_panel}] #H #[default]'
set-window-option -g window-status-separator ''
set-window-option -g window-status-current-format "#[fg=#{@tokyonight_blue},bg=#{@tokyonight_bg}] #[fg=#{@tokyonight_bg},bg=#{@tokyonight_blue},bold] #{?window_zoomed_flag,⤢ ,}#I #[fg=#{@tokyonight_fg},bg=#{@tokyonight_bg_panel},nobold] #T #[fg=#{@tokyonight_bg_panel},bg=#{@tokyonight_bg}] "
set-window-option -g window-status-format "#[fg=#{@tokyonight_bg_muted},bg=#{@tokyonight_bg}] #[fg=#{@tokyonight_blue},bg=#{@tokyonight_bg_muted}] #I #[fg=#{@tokyonight_fg_muted},bg=#{@tokyonight_bg_muted}] #T#{?window_activity_flag, #[fg=#{@tokyonight_yellow}]●,} #[fg=#{@tokyonight_bg_muted},bg=#{@tokyonight_bg}] "

set -g status-right '#{?client_prefix,#[fg=#{@tokyonight_red}#,bg=#{@tokyonight_bg}]#[fg=#{@tokyonight_bg_dark}#,bg=#{@tokyonight_red}#,bold] PREFIX #[fg=#{@tokyonight_red}#,bg=#{@tokyonight_bg}] ,}#{?pane_in_mode,#[fg=#{@tokyonight_yellow}#,bg=#{@tokyonight_bg}]#[fg=#{@tokyonight_bg_dark}#,bg=#{@tokyonight_yellow}#,bold] COPY #[fg=#{@tokyonight_yellow}#,bg=#{@tokyonight_bg}] ,}#[fg=#{@tokyonight_bg_muted},bg=#{@tokyonight_bg}]#[fg=#{@tokyonight_cyan},bg=#{@tokyonight_bg_muted},bold] #W #[fg=#{@tokyonight_fg_muted},bg=#{@tokyonight_bg_panel}] #{?#{==:#{d:pane_current_path},/home/roadhouse},~/#{b:pane_current_path},#{b:pane_current_path}} #[fg=#{@tokyonight_bg_panel},bg=#{@tokyonight_bg}] #[fg=#{@tokyonight_bg_muted},bg=#{@tokyonight_bg}]#[fg=#{@tokyonight_fg},bg=#{@tokyonight_bg_muted}] %a %H:%M #[fg=#{@tokyonight_blue},bg=#{@tokyonight_bg_panel},bold] %Y-%m-%d #[fg=#{@tokyonight_bg_panel},bg=#{@tokyonight_bg}]'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/code/tmux-plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @continuum-restore 'on'
if-shell '[ -d "$HOME/code/tmux-plugins/tpm" ]' "run '$HOME/code/tmux-plugins/tpm/tpm'"
